<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JIGAR Image Uploader</title>
<style>
body { font-family: Arial; background: #111; color: #fff; text-align: center; padding: 20px; }
.container { max-width: 600px; margin: auto; background: #222; padding: 20px; border-radius: 10px; }
input[type="file"] { margin: 15px 0; }
button { background: #1e90ff; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 16px; }
button:hover { background: #0d6efd; }
#links { margin-top: 20px; word-break: break-all; text-align: left; }
a { color: #4fc3f7; }
</style>
</head>
<body>
<div class="container">
<h2>JIGAR Image Uploader</h2>
<input type="file" id="fileInput" accept="image/*" multiple>
<br>
<button onclick="uploadImages()">CREATE LINKS</button>
<div id="links"></div>
</div>

<script>
const ID="546d5cfcc157bd4"; // یہ ٹیسٹ والی Client ID ہے

async function uploadImages() {
  const files = document.getElementById('fileInput').files;
  const linksDiv = document.getElementById('links');
  linksDiv.innerHTML = "Uploading...";

  if(files.length === 0) {
    linksDiv.innerHTML = "پہلے فوٹو سلیکٹ کریں";
    return;
  }

  let allLinks = "";

  for(let i=0; i<files.length; i++) {
    const formData = new FormData();
    formData.append("image", files[i]);

    try {
      const res = await fetch("https://api.imgur.com/3/image", {
        method: "POST",
        headers: { Authorization: "Client-ID " + ID },
        body: formData
      });

      const data = await res.json();

      if(data.success) {
        allLinks += `<p>${i+1}. <a href="${data.data.link}" target="_blank">${data.data.link}</a></p>`;
      } else {
        allLinks += `<p>${i+1}. Error: ${data.data.error}</p>`;
      }
    } catch(err) {
      allLinks += `<p>${i+1}. Network Error</p>`;
    }
  }

  linksDiv.innerHTML = "<h3>Your Links:</h3>" + allLinks;
}
</script>
</body>
</html>
